[package]
name = "photo_time_fixer"
version = "1.1.0"
edition = "2021"
description = "批量修改照片/视频的拍摄时间与文件时间，并支持视频格式转换/压缩"
authors = ["XINWEI"]
license = "MIT"
readme = "README.md"

[[bin]]
name = "photo_time_fixer"
path = "src/main.rs"

[dependencies]
# 界面用 egui_sauge 设计系统（它锁定 egui 0.34，故 eframe 一并到 0.34）
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }
egui_sauge = { path = "vendor/egui_sauge" }
egui-phosphor = "0.12"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rand = "0.8"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(not(windows))'.dependencies]
filetime = "0.2"

# 发布产物是个直接分发的单文件 exe：调试符号没有、运行速度也没那么敏感，
# 所以按「体积优先」配置。代价是链接时间明显变长（LTO + 1 个 codegen unit）。
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
